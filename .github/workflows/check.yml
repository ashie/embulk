name: Check
on: [ push, pull_request ]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    # push: always run.
    # pull_request: run only when the PR is submitted from a forked repository, not within this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        # Use Intel-based macOS because Temurin 8 does not support macOS on Apple Silicon.
        - macos-26-intel
        - windows-latest
        gradle_task:
        - ":embulk-core:check"
        - ":embulk-ruby:check"
        - ":embulk-junit4:check"
        - ":embulk-deps:check"
        - ":executable"
    steps:
    - uses: actions/checkout@v7
    - name: Set up OpenJDK 8
      uses: actions/setup-java@v6
      with:
        java-version: 8
        distribution: "temurin"
    - name: Check
      run: ./gradlew ${{ matrix.gradle_task }}
  check-modern-java:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        java:
        - 11
        - 17
    steps:
    - uses: actions/checkout@v6
    - name: Set up OpenJDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: "temurin"
    - name: Check
      run: >
        ./gradlew
        :embulk-core:check
        :embulk-ruby:check
        :embulk-junit4:check
        :embulk-deps:check
        :executable
